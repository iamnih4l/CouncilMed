[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "councilmed-backend"
version = "0.1.0"
description = "CouncilMed Medical Imaging AI Council Backend"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    # Web framework
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "python-multipart>=0.0.9",
    
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    
    # DICOM & Medical Imaging
    "pydicom>=2.4.0",
    "SimpleITK>=2.3.0",
    "nibabel>=5.2.0",
    "pillow>=10.0.0",
    "scikit-image>=0.22.0",
    
    # ML / Deep Learning
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "monai>=1.3.0",
    "onnxruntime>=1.17.0",
    
    # Explainability
    "pytorch-grad-cam>=1.5.0",
    
    # Agent / LLM
    "langchain>=0.1.0",
    "langgraph>=0.0.20",
    "langchain-community>=0.0.10",
    "httpx>=0.26.0",
    "chromadb>=0.4.0",
    
    # Utilities
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pyyaml>=6.0",
    "structlog>=24.1.0",
    "uuid6>=2024.1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]

gpu = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
]
