name: "ChestXRay-ResNet50"
model_id: "chest_xray_resnet50"
version: "1.0.0"
description: "ResNet50 model pretrained on multiple chest X-ray datasets."
architecture: "TorchXRayVision_ResNet50"
architecture_family: "ResNet"
framework: "pytorch"
tasks:
  - classification
modality: "XRAY"
anatomy: "chest"
num_classes: 18
class_names:
  - "Atelectasis"
  - "Consolidation"
  - "Infiltration"
  - "Pneumothorax"
  - "Edema"
  - "Emphysema"
  - "Fibrosis"
  - "Effusion"
  - "Pneumonia"
  - "Pleural_Thickening"
  - "Cardiomegaly"
  - "Nodule"
  - "Mass"
  - "Hernia"
  - "Lung Lesion"
  - "Fracture"
  - "Lung Opacity"
  - "Enlarged Cardiomediastinum"
input_shape: [512, 512, 1]
input_format: "CHW"
input_normalization: "xrv"
weights_path: "model_registry/weights/xray_resnet50.pth"
weights_checksum: "unknown"
weights_size_mb: 90.0
pretrained_on: "Multiple CXR datasets"
metrics:
  dataset: "Multiple"
  validated: true
min_ram_gb: 1.0
min_vram_gb: 1.0
supports_cpu: true
supports_cuda: true
supports_mps: true
license: "Apache 2.0"
source: "torchxrayvision"
