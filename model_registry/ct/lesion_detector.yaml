name: "CT-Lesion-Detector"
model_id: "ct_lesion_detector"
version: "1.0.0"
description: "Detects pulmonary lesions in CT scans."
architecture: "MonaiLungNoduleDetector"
architecture_family: "RetinaNet"
framework: "pytorch"
tasks:
  - detection
modality: "CT"
anatomy: "chest"
num_classes: 2
class_names:
  - "Normal"
  - "Lesion"
input_shape: [512, 512, 3]
input_format: "HWC"
input_normalization: "zscore"
weights_path: "model_registry/weights/ct_lung_nodule_v2.pth"
weights_checksum: "unknown"
weights_size_mb: 130.0
pretrained_on: "LIDC-IDRI"
metrics:
  dataset: "LIDC-IDRI"
  validated: true
min_ram_gb: 4.0
min_vram_gb: 4.0
supports_cpu: true
supports_cuda: true
supports_mps: true
license: "Apache 2.0"
source: "monai"
