[package]
name = "councilmed-desktop"
version = "0.1.0"
description = "CouncilMed Medical AI Workstation"
authors = ["CouncilMed"]
edition = "2021"

[lib]
name = "councilmed_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
